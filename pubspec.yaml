name: ltrack
description: "LTrack - Computer Lab Inventory: Sistem manajemen inventaris laboratorium komputer, spesifikasi PC, barang pendukung, dan log perbaikan teknisi."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # Local Embedded Database (Hive Community Edition)
  hive_ce: ^2.22.0
  hive_ce_flutter: ^2.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  hive_ce_generator: ^1.12.0
  build_runner: ^2.16.2

flutter:
  uses-material-design: true
